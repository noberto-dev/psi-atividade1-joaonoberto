{% extends "base.html" %}

{% block conteudo %}
    <form action="{{url_for('auth.login')}}" method="post">
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="inputs-form">
        <label for="senha">Senha:</label>
        <input type="password" name="senha" id="inputs-form">

        <button type="submit">Login</button>
    </form>
{% endblock %}
