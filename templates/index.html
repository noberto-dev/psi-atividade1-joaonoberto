{% extends "base.html" %}

{% block conteudo %}    

<h3>Livros:</h3>

{% for livro in livros %}
    <div class="card">
        <p>{{livro['id']}}</p>
        <p>{{livro['titulo']}}</p>
        <p>{{livro['autor']}}</p>
        <p>{{livro['ano']}}</p>
        <p>{{livro['genero']}}</p>
        <a href="{{url_for('livro_detalhe', livro_id=livro.id)}}">Detalhes</a>
    </div>
    

{% endfor %}
{% endblock %}
